<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六經山林</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #ffffff;
      --ink: #2c2c2c;
      --ink-light: #6b6b6b;
      --line: #e5e0d8;
      --accent: #5b7c5a;
      --accent-soft: #e8f0e7;
      --warm: #c4a77d;
      --correct: #4a7c59;
      --wrong: #b85c38;
      --radius: 22px;
      --radius-sm: 16px;
      --shadow: 0 4px 24px rgba(44, 44, 44, 0.07);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Hiragino Sans", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.6;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    .page {
      display: none;
      min-height: 100vh;
      padding: 24px 20px 40px;
      animation: fadeIn 0.35s ease;
    }
    .page.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 首頁 */
    #page-home {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 24px;
    }
    #page-home.active { display: flex; }

    .logo {
      font-size: 2.3rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }
    .desc {
      font-size: 0.95rem;
      color: var(--ink-light);
      margin-bottom: 48px;
      line-height: 1.7;
    }
    .home-footer {
      position: absolute;
      bottom: 32px;
      font-size: 0.75rem;
      color: #b0a99f;
    }

    .btn-main {
      background: var(--accent);
      color: white;
      border: none;
      padding: 15px 48px;
      border-radius: 50px;
      font-size: 1rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 14px rgba(91, 124, 90, 0.25);
    }
    .btn-main:hover {
      background: #4a6b49;
      transform: translateY(-2px);
    }

    .btn-back {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--ink-light);
      cursor: pointer;
      padding: 4px 8px;
    }

    /* 選擇關卡 */
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .page-header h2 {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .module-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .module-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.25s;
      border: 1.5px solid transparent;
      text-align: center;
    }
    .module-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(91, 124, 90, 0.13);
    }

    /* 臨床總覽佔滿整行 */
    .module-card.wide {
      grid-column: 1 / -1;
      padding: 26px 20px;
    }
    .module-card.wide .module-emoji {
      font-size: 2.2rem;
    }
    .module-card.wide .module-name {
      font-size: 1.25rem;
    }

    .module-emoji { font-size: 1.8rem; margin-bottom: 8px; }
    .module-num { font-size: 0.72rem; color: var(--warm); letter-spacing: 0.1em; margin-bottom: 4px; }
    .module-name { font-size: 1.05rem; font-weight: 500; margin-bottom: 4px; }
    .module-desc { font-size: 0.8rem; color: var(--ink-light); }

    /* 答題頁 */
    .quiz-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .quiz-progress-info { font-size: 0.9rem; color: var(--ink-light); }
    .quiz-score { font-size: 0.95rem; font-weight: 500; color: var(--accent); }

    .progress-track {
      height: 6px;
      background: var(--line);
      border-radius: 10px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .quiz-body {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 22px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .diff-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-bottom: 16px;
    }
    .diff-tag.中等 { background: #f5efe6; color: #a67c52; }
    .diff-tag.困難 { background: #f8e9e6; color: var(--wrong); }

    .question {
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .options { display: flex; flex-direction: column; gap: 12px; }

    .option {
      background: #fafaf7;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 15px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .option:hover:not(.disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .option.correct {
      border-color: var(--correct);
      background: #eaf3ec;
      color: var(--correct);
    }
    .option.wrong {
      border-color: var(--wrong);
      background: #fdf0eb;
      color: var(--wrong);
    }
    .option.disabled { pointer-events: none; }

    .feedback-panel {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.3s ease;
    }
    .feedback-panel.hidden { display: none; }

    .feedback-title {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 14px;
    }
    .feedback-title.ok { color: var(--correct); }
    .feedback-title.ng { color: var(--wrong); }

    .feedback-explain {
      background: #f7f4ef;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--ink-light);
      margin-bottom: 20px;
      line-height: 1.55;
    }

    /* 結算 */
    #page-result {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #page-result.active { display: flex; }

    .result-emoji { font-size: 3rem; margin-bottom: 12px; }
    .result-label {
      font-size: 0.9rem;
      color: var(--ink-light);
      letter-spacing: 0.15em;
      margin-bottom: 12px;
    }
    .result-score {
      font-size: 3.4rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 32px;
    }
    .result-detail {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 36px;
      display: flex;
      justify-content: space-around;
    }
    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-item span { font-size: 0.8rem; color: var(--ink-light); }
    .detail-item strong { font-size: 1.3rem; font-weight: 500; }
  </style>
</head>
<body>
  <div id="app">

    <!-- 首頁 -->
    <section id="page-home" class="page active">
      <div class="home-content">
        <div class="logo">🌿六經山林🌿</div>
        <p class="desc">入此林者，以經典為舟<br>以臨床為岸，溫故而知新</p>
        <button class="btn-main" id="btn-start">踏入山林</button>
      </div>
      <div class="home-footer">杏林一脈 · 六經為綱</div>
    </section>

    <!-- 選擇關卡 -->
    <section id="page-modules" class="page">
      <div class="page-header">
        <button class="btn-back" data-back="home">←</button>
        <h2>選擇修行關卡</h2>
      </div>
      <div class="module-grid">
        <!-- 臨床總覽：佔滿整行 -->
        <div class="module-card wide" data-module="all">
          <div class="module-emoji">📚</div>
          <div class="module-num">總錄</div>
          <div class="module-name">臨床總覽</div>
          <div class="module-desc">融會貫通 · 綜合印證</div>
        </div>

        <div class="module-card" data-module="M1">
          <div class="module-emoji">☯️</div>
          <div class="module-num">第一關</div>
          <div class="module-name">六經辨證</div>
          <div class="module-desc">核心心法</div>
        </div>
        <div class="module-card" data-module="M2">
          <div class="module-emoji">🍵</div>
          <div class="module-num">第二關</div>
          <div class="module-name">經典方劑</div>
          <div class="module-desc">方證對應</div>
        </div>
        <div class="module-card" data-module="M3">
          <div class="module-emoji">🌿</div>
          <div class="module-num">第三關</div>
          <div class="module-name">本草安全</div>
          <div class="module-desc">藥性與毒性</div>
        </div>
        <div class="module-card" data-module="M4">
          <div class="module-emoji">📍</div>
          <div class="module-num">第四關</div>
          <div class="module-name">經絡俞穴</div>
          <div class="module-desc">特定穴法</div>
        </div>
        <div class="module-card" data-module="M5">
          <div class="module-emoji">📜</div>
          <div class="module-num">第五關</div>
          <div class="module-name">經典原文</div>
          <div class="module-desc">傷寒金匱溫病</div>
        </div>
        <div class="module-card" data-module="M6">
          <div class="module-emoji">🩺</div>
          <div class="module-num">第六關</div>
          <div class="module-name">疑難臨證</div>
          <div class="module-desc">中西會通</div>
        </div>
      </div>
    </section>

    <!-- 修行中 -->
    <section id="page-quiz" class="page">
      <div class="quiz-top">
        <button class="btn-back" data-back="modules">←</button>
        <div class="quiz-progress-info">心法 <span id="q-current">1</span> / <span id="q-total">20</span></div>
        <div class="quiz-score">道行 <span id="live-score">0</span></div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="quiz-body">
        <div class="diff-tag" id="diff-tag">基礎</div>
        <h2 class="question" id="question-text">題目載入中...</h2>
        <div class="options" id="options"></div>
      </div>
      <div class="feedback-panel hidden" id="feedback-panel">
        <div class="feedback-title" id="feedback-title"></div>
        <div class="feedback-explain" id="feedback-explain"></div>
        <button class="btn-main" id="btn-next">印證下一心法 →</button>
      </div>
    </section>

    <!-- 功果 -->
    <section id="page-result" class="page">
      <div class="result-content">
        <div class="result-emoji">🎌</div>
        <div class="result-label">本次修行功果</div>
        <div class="result-score" id="result-score">0</div>
        <div class="result-detail">
          <div class="detail-item"><span>領悟</span><strong id="result-correct">0</strong></div>
          <div class="detail-item"><span>心法</span><strong id="result-total">0</strong></div>
          <div class="detail-item"><span>契合度</span><strong id="result-accuracy">0%</strong></div>
        </div>
        <button class="btn-main" id="btn-home">回歸山林</button>
      </div>
    </section>
  </div>

  <script>
const allQuestions = [
  // M1 六經辨證 (50)
  {"id":"M1-001","module":"M1","difficulty":"基礎","question":"患者惡寒發熱、頭痛項強、無汗而喘、脈浮緊。最符合下列何證？","options":["A. 太陽中風證","B. 太陽傷寒證","C. 陽明經證","D. 少陽病"],"answer":"B","explanation":"無汗、脈浮緊為太陽傷寒（麻黃湯證）。"},
  {"id":"M1-002","module":"M1","difficulty":"基礎","question":"往來寒熱、胸脅苦滿、默默不欲飲食、心煩喜嘔、口苦咽乾目眩，屬哪一經病？","options":["A. 太陽病","B. 陽明病","C. 少陽病","D. 太陰病"],"answer":"C","explanation":"此為少陽病提綱證。"},
  {"id":"M1-003","module":"M1","difficulty":"中等","question":"患者腹滿而吐、食不下、自利益甚、時腹自痛，最可能的六經定位是？","options":["A. 陽明腑實證","B. 太陰病","C. 少陰病","D. 厥陰病"],"answer":"B","explanation":"此為太陰病提綱，脾陽虛寒。"},
  {"id":"M1-004","module":"M1","difficulty":"中等","question":"少陰病，始得之，反發熱，脈沉者，宜用何方？","options":["A. 四逆湯","B. 麻黃附子細辛湯","C. 真武湯","D. 白通湯"],"answer":"B","explanation":"少陰病反發熱、脈沉，為太少兩感。"},
  {"id":"M1-005","module":"M1","difficulty":"困難","question":"患者消渴、氣上撞心、心中疼熱、飢而不欲食、食則吐蛔，四肢厥冷。六經病機最可能是？","options":["A. 太陰虛寒","B. 少陰寒化","C. 厥陰病寒熱錯雜","D. 陽明熱盛"],"answer":"C","explanation":"典型厥陰病寒熱錯雜表現。"},
  {"id":"M1-006","module":"M1","difficulty":"基礎","question":"患者發熱、惡寒、頭項強痛、身痛、無汗、脈浮緊，治療首選方劑是？","options":["A. 桂枝湯","B. 麻黃湯","C. 葛根湯","D. 大青龍湯"],"answer":"B","explanation":"典型太陽傷寒證，麻黃湯主之。"},
  {"id":"M1-007","module":"M1","difficulty":"基礎","question":"太陽病，發熱汗出、惡風、脈緩者，名為？","options":["A. 傷寒","B. 中風","C. 溫病","D. 風溫"],"answer":"B","explanation":"《傷寒論》第2條：名為中風。"},
  {"id":"M1-008","module":"M1","difficulty":"中等","question":"患者太陽病不解，傳入少陽，見往來寒熱、胸脅苦滿，此時禁用哪些治法？","options":["A. 汗法","B. 吐法","C. 下法","D. 以上皆是"],"answer":"D","explanation":"少陽病禁用汗、吐、下。"},
  {"id":"M1-009","module":"M1","difficulty":"中等","question":"陽明病，胃家實的核心表現不包括下列哪一項？","options":["A. 腹滿痛拒按","B. 潮熱譫語","C. 手足濈然汗出","D. 脈浮緩"],"answer":"D","explanation":"陽明腑實證脈當沉實有力。"},
  {"id":"M1-010","module":"M1","difficulty":"中等","question":"少陰病，四逆、惡寒蜷臥、脈微細、但欲寐，又見下利清穀，治療宜選？","options":["A. 四逆湯","B. 真武湯","C. 白通湯","D. 通脈四逆湯"],"answer":"A","explanation":"典型少陰寒化證，四逆湯回陽救逆。"},
  {"id":"M1-011","module":"M1","difficulty":"困難","question":"患者傷寒，脈結代、心動悸，宜用何方？","options":["A. 炙甘草湯","B. 桂枝甘草湯","C. 真武湯","D. 苓桂術甘湯"],"answer":"A","explanation":"《傷寒論》第177條：炙甘草湯主之。"},
  {"id":"M1-012","module":"M1","difficulty":"困難","question":"厥陰病提綱證的核心特點是？","options":["A. 純寒無熱","B. 純熱無寒","C. 寒熱錯雜、陰陽氣不相順接","D. 表寒裡熱"],"answer":"C","explanation":"厥陰病常見寒熱錯雜、厥熱勝復。"},
  {"id":"M1-013","module":"M1","difficulty":"中等","question":"太陽與少陽合病，見頭項強痛、或眩冒、時如結胸、心下痞硬，宜用？","options":["A. 小柴胡湯","B. 柴胡桂枝湯","C. 大柴胡湯","D. 柴胡加芒硝湯"],"answer":"B","explanation":"太陽少陽合病，用柴胡桂枝湯。"},
  {"id":"M1-015","module":"M1","difficulty":"中等","question":"陽明病，口大渴、脈洪大、大熱、大汗出，屬？","options":["A. 陽明腑實證","B. 陽明經證（氣分熱盛）","C. 太陽溫病","D. 少陽病"],"answer":"B","explanation":"四大症為白虎湯證，屬陽明經證。"},
  {"id":"M1-020","module":"M1","difficulty":"基礎","question":"太陰病的提綱證是？","options":["A. 腹滿而吐，食不下，自利益甚，時腹自痛","B. 脈微細，但欲寐","C. 往來寒熱，胸脅苦滿","D. 口苦、咽乾、目眩"],"answer":"A","explanation":"《傷寒論》第273條為太陰病提綱。"},
  {"id":"M1-029","module":"M1","difficulty":"基礎","question":"六經病中，最易出現「寒熱往來」的是哪一經？","options":["A. 太陽","B. 陽明","C. 少陽","D. 厥陰"],"answer":"C","explanation":"少陽為樞，邪正分爭，故見往來寒熱。"},
  {"id":"M1-030","module":"M1","difficulty":"困難","question":"患者厥陰病，厥熱勝復，若熱多厥少，預後如何？","options":["A. 熱多厥少則病退，厥多熱少則病進","B. 熱多厥少則病進，厥多熱少則病退","C. 兩者預後相同","D. 與預後無關"],"answer":"A","explanation":"熱為陽氣來復之象，熱多則正氣勝。"},
  {"id":"M1-031","module":"M1","difficulty":"中等","question":"患者太陽病，發汗後，惡寒加重、脈微細，此時最可能轉入哪一經？","options":["A. 陽明","B. 少陽","C. 太陰","D. 少陰"],"answer":"D","explanation":"發汗太過，陽氣受損，易轉入少陰。"},
  {"id":"M1-032","module":"M1","difficulty":"困難","question":"少陰病，下利止而頭眩、時時自冒者，病機是？","options":["A. 陽氣來復","B. 陰液枯竭、虛陽上浮","C. 痰飲上蒙","D. 表邪未解"],"answer":"B","explanation":"下利止而頭眩自冒，為陰竭陽浮，預後較差。"},
  {"id":"M1-033","module":"M1","difficulty":"中等","question":"陽明病，譫語、潮熱、腹滿痛、脈沉實，宜用？","options":["A. 白虎湯","B. 小承氣湯","C. 大承氣湯","D. 調胃承氣湯"],"answer":"C","explanation":"痞滿燥實全具，當用大承氣湯。"},
  {"id":"M1-034","module":"M1","difficulty":"基礎","question":"少陽病的提綱證是？","options":["A. 口苦、咽乾、目眩","B. 往來寒熱、胸脅苦滿","C. 腹滿而吐","D. 脈微細、但欲寐"],"answer":"A","explanation":"《傷寒論》第263條：少陽之為病，口苦、咽乾、目眩也。"},
  {"id":"M1-035","module":"M1","difficulty":"困難","question":"患者傷寒，陽脈澀、陰脈弦，法當腹中急痛，先與小建中湯；不差者小柴胡湯主之。此條文說明？","options":["A. 中焦虛寒為主，兼有少陽","B. 純屬少陽病","C. 純屬太陰病","D. 應直接用承氣湯"],"answer":"A","explanation":"先建中後柴胡，提示中虛為本、少陽為標。"},
  {"id":"M1-036","module":"M1","difficulty":"中等","question":"太陽病誤下後，出現心下痞、按之濡，關脈浮，屬？","options":["A. 大結胸","B. 小結胸","C. 熱痞","D. 寒痞"],"answer":"C","explanation":"心下痞、按之濡、關脈浮為熱痞，宜瀉心湯類。"},
  {"id":"M1-037","module":"M1","difficulty":"基礎","question":"厥陰病最常見的寒熱錯雜代表方是？","options":["A. 四逆湯","B. 烏梅丸","C. 白虎湯","D. 理中湯"],"answer":"B","explanation":"烏梅丸為厥陰病寒熱錯雜主方。"},
  {"id":"M1-038","module":"M1","difficulty":"中等","question":"少陰病，吐利、手足逆冷、煩躁欲死者，宜用？","options":["A. 四逆湯","B. 吳茱萸湯","C. 真武湯","D. 白通湯"],"answer":"B","explanation":"此為吳茱萸湯證，屬肝胃虛寒、濁陰上逆。"},
  {"id":"M1-041","module":"M1","difficulty":"基礎","question":"太陽病的提綱證是？","options":["A. 脈浮，頭項強痛而惡寒","B. 胃家實","C. 口苦咽乾目眩","D. 腹滿而吐"],"answer":"A","explanation":"《傷寒論》第1條為太陽病提綱。"},
  {"id":"M1-042","module":"M1","difficulty":"中等","question":"患者太陽病，服桂枝湯後大汗出、脈洪大，宜轉用？","options":["A. 繼續桂枝湯","B. 白虎加人參湯","C. 調胃承氣湯","D. 麻黃湯"],"answer":"B","explanation":"汗出過多轉入陽明氣分熱盛傷氣。"},
  {"id":"M1-043","module":"M1","difficulty":"困難","question":"少陰病，下利清穀、裡寒外熱、手足厥逆、脈微欲絕、身反不惡寒、其人面色赤，宜用？","options":["A. 四逆湯","B. 通脈四逆湯","C. 白通湯","D. 真武湯"],"answer":"B","explanation":"此為陰盛格陽，通脈四逆湯主之。"},
  {"id":"M1-044","module":"M1","difficulty":"中等","question":"陽明病，外證若何？","options":["A. 身熱、汗自出、不惡寒反惡熱","B. 惡寒發熱","C. 往來寒熱","D. 手足厥冷"],"answer":"A","explanation":"陽明外證為身熱、汗出、不惡寒反惡熱。"},
  {"id":"M1-045","module":"M1","difficulty":"基礎","question":"太陰病下利，若欲作再經者，需觀察什麼？","options":["A. 手足溫否","B. 汗出與否","C. 脈浮與否","D. 口渴與否"],"answer":"A","explanation":"太陰病手足自溫，為欲作再經之兆。"},
  {"id":"M1-046","module":"M1","difficulty":"困難","question":"患者厥陰病，下利、脈數、心中疼熱、飢不欲食，又見吐蛔，最適合的思路是？","options":["A. 純用溫藥","B. 純用寒藥","C. 寒熱並用、酸苦辛甘合方","D. 先下後溫"],"answer":"C","explanation":"烏梅丸寒熱並用，治厥陰寒熱錯雜。"},
  {"id":"M1-047","module":"M1","difficulty":"中等","question":"太陽病，下之，其氣上衝者，可與桂枝湯；若不上衝者，不可與之。此「氣上衝」提示？","options":["A. 表證仍在","B. 裡證已成","C. 陽氣已虛","D. 陰液已傷"],"answer":"A","explanation":"氣上衝表示表邪仍在，可繼續解表。"},
  {"id":"M1-048","module":"M1","difficulty":"基礎","question":"少陰病，始得之，反發熱，脈沉者，麻黃附子細辛湯主之。此屬？","options":["A. 太少兩感","B. 少陰寒化","C. 少陰熱化","D. 厥陰病"],"answer":"A","explanation":"太陽與少陰同病，為太少兩感。"},
  {"id":"M1-049","module":"M1","difficulty":"中等","question":"陽明病，若能食，名中風；不能食，名中寒。此處「中風」「中寒」是指？","options":["A. 外感風寒","B. 胃熱與胃寒的區別","C. 太陽病傳變","D. 少陽病"],"answer":"B","explanation":"能食為胃熱，不能食為胃中虛寒。"},
  {"id":"M1-050","module":"M1","difficulty":"困難","question":"患者傷寒六七日，大下後，寸脈沉而遲，手足厥逆，下部脈不至，咽喉不利，唾膿血，泄利不止，為難治。此屬？","options":["A. 陽明腑實","B. 厥陰病危證","C. 少陰病","D. 太陰病"],"answer":"B","explanation":"此為厥陰病危重表現。"},
  {"id":"M1-051","module":"M1","difficulty":"中等","question":"患者太陽病，發汗後，汗出不止、惡風、小便難、四肢微急、難以屈伸，宜用？","options":["A. 桂枝湯","B. 桂枝加附子湯","C. 真武湯","D. 四逆湯"],"answer":"B","explanation":"發汗太過導致陽虛汗漏，用桂枝加附子湯。"},
  {"id":"M1-052","module":"M1","difficulty":"困難","question":"少陰病，下利、脈微細、但欲寐，又見心煩、不得臥，屬？","options":["A. 少陰寒化","B. 少陰熱化","C. 太陰病","D. 厥陰病"],"answer":"B","explanation":"心煩不得臥為少陰熱化（黃連阿膠湯證傾向）。"},
  {"id":"M1-053","module":"M1","difficulty":"基礎","question":"陽明病的提綱是？","options":["A. 胃家實","B. 口苦咽乾目眩","C. 腹滿而吐","D. 脈微細但欲寐"],"answer":"A","explanation":"《傷寒論》第180條：陽明之為病，胃家實是也。"},
  {"id":"M1-054","module":"M1","difficulty":"中等","question":"患者少陽病，往來寒熱已罷，轉見潮熱、腹滿便秘，屬何種傳變？","options":["A. 少陽傳太陰","B. 少陽傳陽明","C. 少陽傳少陰","D. 少陽傳厥陰"],"answer":"B","explanation":"少陽病不解，邪入陽明化熱成實。"},
  {"id":"M1-055","module":"M1","difficulty":"困難","question":"厥陰病，厥熱勝復，若厥多熱少，預後如何？","options":["A. 病退","B. 病進","C. 無影響","D. 需觀察汗出"],"answer":"B","explanation":"厥多熱少表示陰寒盛、陽氣不復，病進。"},

  // M2 經典方劑 (40)
  {"id":"M2-001","module":"M2","difficulty":"基礎","question":"桂枝湯與麻黃湯的主要鑑別點在於？","options":["A. 有汗與無汗","B. 脈浮緩與脈浮緊","C. 以上皆是","D. 惡風與惡寒"],"answer":"C","explanation":"桂枝湯證有汗脈浮緩；麻黃湯證無汗脈浮緊。"},
  {"id":"M2-002","module":"M2","difficulty":"中等","question":"患者胸脅苦滿、往來寒熱，又見心下急、鬱鬱微煩、腹中痛，較適合何方？","options":["A. 小柴胡湯","B. 大柴胡湯","C. 柴胡桂枝湯","D. 柴胡加龍骨牡蠣湯"],"answer":"B","explanation":"少陽兼陽明，用大柴胡湯。"},
  {"id":"M2-004","module":"M2","difficulty":"困難","question":"痞證見「心下痞，而復惡寒汗出者」，宜用？","options":["A. 半夏瀉心湯","B. 甘草瀉心湯","C. 附子瀉心湯","D. 生薑瀉心湯"],"answer":"C","explanation":"熱痞兼表陽虛，用附子瀉心湯。"},
  {"id":"M2-005","module":"M2","difficulty":"中等","question":"溫病初起，身熱、微惡風寒、咳嗽、口微渴，最適合？","options":["A. 銀翹散","B. 桑菊飲","C. 麻杏石甘湯","D. 桂枝湯"],"answer":"B","explanation":"桑菊飲辛涼輕劑，主治風溫咳嗽。"},
  {"id":"M2-006","module":"M2","difficulty":"基礎","question":"患者太陽中風，汗出惡風、脈浮緩，首選方是？","options":["A. 麻黃湯","B. 桂枝湯","C. 葛根湯","D. 大青龍湯"],"answer":"B","explanation":"太陽中風證，桂枝湯主之。"},
  {"id":"M2-010","module":"M2","difficulty":"基礎","question":"陽明腑實證，痞滿燥實皆具，潮熱譫語、手足濈然汗出，首選？","options":["A. 小承氣湯","B. 調胃承氣湯","C. 大承氣湯","D. 桃核承氣湯"],"answer":"C","explanation":"痞滿燥實全具，用大承氣湯。"},
  {"id":"M2-013","module":"M2","difficulty":"困難","question":"四逆湯、通脈四逆湯、白通湯的主要鑑別在於？","options":["A. 四逆湯治陽虛寒厥；通脈四逆湯治陰盛格陽；白通湯治陰寒盛於下、虛陽上浮","B. 三者完全相同","C. 僅附子劑量不同","D. 僅乾薑劑量不同"],"answer":"A","explanation":"三方皆回陽，但病勢與病位有別。"},
  {"id":"M2-014","module":"M2","difficulty":"基礎","question":"患者惡寒發熱、無汗、喘、脈浮緊，兼見煩躁，宜用？","options":["A. 麻黃湯","B. 大青龍湯","C. 麻杏石甘湯","D. 桂枝湯"],"answer":"B","explanation":"太陽傷寒兼內熱煩躁，用大青龍湯。"},
  {"id":"M2-015","module":"M2","difficulty":"中等","question":"銀翹散與桑菊飲的主要鑑別點是？","options":["A. 銀翹散解表力較強，主治熱重咳嗽輕；桑菊飲宣肺止咳力較強，主治咳嗽重而熱較輕","B. 兩者主治完全相同","C. 銀翹散用於傷寒，桑菊飲用於溫病","D. 僅薄荷用量不同"],"answer":"A","explanation":"銀翹散辛涼透表力強，桑菊飲側重宣肺止咳。"},
  {"id":"M2-019","module":"M2","difficulty":"困難","question":"小柴胡湯與大柴胡湯的關鍵鑑別點是？","options":["A. 小柴胡湯治少陽病；大柴胡湯治少陽兼陽明腑實","B. 兩者僅柴胡劑量不同","C. 大柴胡湯不用大黃","D. 小柴胡湯可攻下"],"answer":"A","explanation":"大柴胡湯兼治陽明裡實。"},
  {"id":"M2-020","module":"M2","difficulty":"基礎","question":"患者陽明經證，大熱、大汗、大渴、脈洪大，首選？","options":["A. 白虎湯","B. 白虎加人參湯","C. 竹葉石膏湯","D. 承氣湯"],"answer":"A","explanation":"四大症俱備，白虎湯主之。"},
  {"id":"M2-021","module":"M2","difficulty":"中等","question":"桂枝去芍藥加蜀漆牡蠣龍骨救逆湯主要治療？","options":["A. 太陽病誤下後脈促胸滿","B. 火逆致驚狂、臥起不安","C. 陽虛水泛","D. 少陽病"],"answer":"B","explanation":"此方治火逆後驚狂、臥起不安。"},
  {"id":"M2-022","module":"M2","difficulty":"基礎","question":"患者腹中冷痛、喜溫喜按、嘔吐下利、手足不溫，首選？","options":["A. 四逆湯","B. 理中湯","C. 吳茱萸湯","D. 小建中湯"],"answer":"B","explanation":"太陰虛寒，理中湯溫中健脾。"},
  {"id":"M2-023","module":"M2","difficulty":"困難","question":"半夏瀉心湯與甘草瀉心湯的主要區別是？","options":["A. 甘草瀉心湯甘草用量較大，治胃氣虛弱、痞利俱甚","B. 兩者完全相同","C. 半夏瀉心湯不用乾薑","D. 甘草瀉心湯不用半夏"],"answer":"A","explanation":"甘草瀉心湯加重甘草，更適合胃虛痞利。"},
  {"id":"M2-024","module":"M2","difficulty":"中等","question":"患者太陽病，下之後，脈促胸滿者，宜用？","options":["A. 桂枝湯","B. 桂枝去芍藥湯","C. 桂枝加厚朴杏子湯","D. 葛根湯"],"answer":"B","explanation":"誤下後脈促胸滿，去芍藥以免陰柔礙陽。"},
  {"id":"M2-025","module":"M2","difficulty":"基礎","question":"白虎湯的四大主證是？","options":["A. 大熱、大汗、大渴、脈洪大","B. 潮熱、譫語、腹滿、便秘","C. 往來寒熱、胸脅苦滿","D. 惡寒發熱、無汗、脈浮緊"],"answer":"A","explanation":"白虎湯證以四大症為核心。"},
  {"id":"M2-026","module":"M2","difficulty":"中等","question":"真武湯與附子湯的主要鑑別點是？","options":["A. 真武湯治陽虛水泛；附子湯治陽虛寒濕身痛","B. 兩者主治相同","C. 真武湯附子用量更大","D. 附子湯不用茯苓"],"answer":"A","explanation":"真武重在利水，附子湯重在祛寒濕止痛。"},
  {"id":"M2-027","module":"M2","difficulty":"困難","question":"柴胡桂枝乾薑湯最適合哪種病機？","options":["A. 少陽病兼水飲內停、氣鬱化熱","B. 少陽兼陽明腑實","C. 太陽少陽合病","D. 少陽病誤下後驚狂"],"answer":"A","explanation":"柴胡桂枝乾薑湯治少陽病兼水飲。"},
  {"id":"M2-031","module":"M2","difficulty":"中等","question":"桂枝加附子湯主要治療？","options":["A. 太陽病誤下後脈促胸滿","B. 發汗太過、陽虛汗漏","C. 陽虛水泛","D. 少陰陽虛"],"answer":"B","explanation":"桂枝加附子湯治汗漏不止、惡風、小便難、四肢微急。"},
  {"id":"M2-032","module":"M2","difficulty":"基礎","question":"患者腹滿痛、潮熱、譫語、手足濈然汗出、脈沉實，首選？","options":["A. 小承氣湯","B. 調胃承氣湯","C. 大承氣湯","D. 桃核承氣湯"],"answer":"C","explanation":"痞滿燥實全具，大承氣湯峻下。"},
  {"id":"M2-033","module":"M2","difficulty":"困難","question":"柴胡加龍骨牡蠣湯最適合的病機是？","options":["A. 少陽病誤下後，邪氣擴散、心神受擾","B. 少陽兼陽明腑實","C. 太陽少陽合病","D. 少陽病兼水飲"],"answer":"A","explanation":"此方治胸滿煩驚、小便不利、譫語、一身盡重。"},
  {"id":"M2-034","module":"M2","difficulty":"中等","question":"生薑瀉心湯與半夏瀉心湯的主要區別在於？","options":["A. 生薑瀉心湯重在治水飲食滯痞","B. 兩者完全相同","C. 生薑瀉心湯不用乾薑","D. 半夏瀉心湯甘草更多"],"answer":"A","explanation":"生薑瀉心湯針對乾嘔食臭、腹中雷鳴。"},
  {"id":"M2-035","module":"M2","difficulty":"基礎","question":"患者惡寒發熱、無汗、喘、脈浮緊，兼見煩躁，宜用？","options":["A. 麻黃湯","B. 大青龍湯","C. 麻杏石甘湯","D. 桂枝湯"],"answer":"B","explanation":"太陽傷寒兼內熱，用大青龍湯。"},
  {"id":"M2-036","module":"M2","difficulty":"中等","question":"白虎加人參湯與白虎湯的主要鑑別點是？","options":["A. 白虎加人參湯兼有氣津兩傷","B. 兩者主治完全相同","C. 白虎加人參湯熱勢更重","D. 白虎湯已包含人參"],"answer":"A","explanation":"汗多、渴甚、脈大無力時加人參。"},
  {"id":"M2-038","module":"M2","difficulty":"中等","question":"葛根湯與桂枝加葛根湯的主要鑑別是？","options":["A. 有汗與無汗","B. 項背強几几的程度","C. 是否兼喘","D. 脈象"],"answer":"A","explanation":"葛根湯無汗，桂枝加葛根湯有汗。"},
  {"id":"M2-039","module":"M2","difficulty":"基礎","question":"理中湯的主治病機是？","options":["A. 太陰虛寒","B. 少陰陽虛","C. 厥陰寒熱錯雜","D. 陽明腑實"],"answer":"A","explanation":"理中湯溫中健脾，治太陰虛寒。"},
  {"id":"M2-040","module":"M2","difficulty":"困難","question":"附子瀉心湯與半夏瀉心湯的核心區別是？","options":["A. 附子瀉心湯治熱痞兼表陽虛","B. 兩者相同","C. 附子瀉心湯不用黃連","D. 半夏瀉心湯用附子"],"answer":"A","explanation":"附子瀉心湯見惡寒汗出。"},
  {"id":"M2-041","module":"M2","difficulty":"中等","question":"患者太陽病，項背強几几、無汗、惡風，宜用？","options":["A. 桂枝湯","B. 桂枝加葛根湯","C. 葛根湯","D. 麻黃湯"],"answer":"C","explanation":"無汗用葛根湯，有汗用桂枝加葛根湯。"},
  {"id":"M2-042","module":"M2","difficulty":"基礎","question":"大承氣湯的適應證核心是？","options":["A. 痞滿燥實全具","B. 僅有潮熱","C. 僅有腹滿","D. 僅有譫語"],"answer":"A","explanation":"痞、滿、燥、實四證具備才用大承氣湯。"},
  {"id":"M2-043","module":"M2","difficulty":"困難","question":"患者少陰病，吐利、手足厥冷、煩躁欲死，吳茱萸湯主之。此病機是？","options":["A. 肝胃虛寒、濁陰上逆","B. 少陰陽虛","C. 太陰虛寒","D. 厥陰寒熱錯雜"],"answer":"A","explanation":"吳茱萸湯證屬肝胃虛寒。"},
  {"id":"M2-044","module":"M2","difficulty":"中等","question":"小建中湯與黃耆建中湯的主要區別是？","options":["A. 黃耆建中湯多黃耆，更善於補氣固表","B. 兩者完全相同","C. 小建中湯用黃耆","D. 黃耆建中湯不用芍藥"],"answer":"A","explanation":"黃耆建中湯在小建中基礎上加黃耆。"},
  {"id":"M2-045","module":"M2","difficulty":"基礎","question":"患者心下痞、按之濡、關脈浮，宜用哪類方？","options":["A. 承氣湯類","B. 瀉心湯類","C. 四逆湯類","D. 柴胡湯類"],"answer":"B","explanation":"熱痞用瀉心湯類。"},

  // M3 本草安全 (30)
  {"id":"M3-001","module":"M3","difficulty":"基礎","question":"下列哪味藥性味歸經為「辛、微苦，溫，歸肺、膀胱經」？","options":["A. 麻黃","B. 桂枝","C. 杏仁","D. 紫蘇"],"answer":"A","explanation":"麻黃辛微苦溫，歸肺、膀胱經。"},
  {"id":"M3-002","module":"M3","difficulty":"基礎","question":"具有「酸甘化陰」配伍特點的代表藥物組合是？","options":["A. 麻黃 + 桂枝","B. 白芍 + 甘草","C. 黃連 + 乾薑","D. 半夏 + 生薑"],"answer":"B","explanation":"白芍酸寒、甘草甘平，酸甘化陰。"},
  {"id":"M3-003","module":"M3","difficulty":"中等","question":"關於附子的安全使用，下列何者正確？","options":["A. 可與半夏同用","B. 必須先煎久煎以減毒","C. 孕婦可常規使用","D. 中毒時只需飲綠豆湯即可"],"answer":"B","explanation":"附子有毒，必須先煎30–60分鐘以上。"},
  {"id":"M3-004","module":"M3","difficulty":"中等","question":"妊娠婦女禁用的峻下逐水藥是？","options":["A. 大黃","B. 甘遂","C. 芒硝","D. 牽牛子"],"answer":"B","explanation":"甘遂為峻猛有毒逐水藥，妊娠絕對禁用。"},
  {"id":"M3-005","module":"M3","difficulty":"困難","question":"患者服用含川烏的湯劑後出現口唇四肢麻木、心跳緩慢、血壓下降。首要處理是？","options":["A. 立即大量飲水","B. 使用阿托品等抗膽鹼藥，並緊急就醫","C. 繼續服藥觀察","D. 只服用甘草湯"],"answer":"B","explanation":"烏頭鹼中毒，需立即停藥並用阿托品對抗。"},
  {"id":"M3-006","module":"M3","difficulty":"基礎","question":"下列哪味藥屬「大辛大熱、有毒」？","options":["A. 乾薑","B. 附子","C. 肉桂","D. 吳茱萸"],"answer":"B","explanation":"附子大辛大熱、有毒。"},
  {"id":"M3-008","module":"M3","difficulty":"中等","question":"下列哪組屬於「十八反」？","options":["A. 甘草反甘遂、大戟、海藻、芫花","B. 烏頭反半夏、瓜蔞、貝母、白蘞、白及","C. 以上皆是","D. 僅藜蘆反人參"],"answer":"C","explanation":"十八反包括多組相反藥對。"},
  {"id":"M3-011","module":"M3","difficulty":"中等","question":"妊娠期間，下列哪類藥物應特別慎用或禁用？","options":["A. 活血化瘀藥","B. 峻下逐水藥","C. 有毒及辛熱走竄藥","D. 以上皆是"],"answer":"D","explanation":"妊娠禁忌主要包括活血、峻下、有毒、辛熱走竄之品。"},
  {"id":"M3-012","module":"M3","difficulty":"基礎","question":"「辛甘化陽」的代表配伍是？","options":["A. 桂枝 + 甘草","B. 白芍 + 甘草","C. 黃連 + 黃芩","D. 半夏 + 陳皮"],"answer":"A","explanation":"桂枝辛溫、甘草甘平，辛甘化陽。"},
  {"id":"M3-017","module":"M3","difficulty":"中等","question":"使用有毒中藥時，最重要的安全原則是？","options":["A. 儘量使用最大劑量以取速效","B. 從小劑量開始，逐漸加量，中病即止，並密切觀察","C. 可長期連續使用","D. 不需炮製"],"answer":"B","explanation":"有毒中藥應從小劑量起用，中病即止。"},
  {"id":"M3-021","module":"M3","difficulty":"中等","question":"關於馬錢子的使用，下列何者正確？","options":["A. 可長期大劑量使用","B. 必須炮製後使用，嚴格控制劑量","C. 孕婦可正常使用","D. 無毒性"],"answer":"B","explanation":"馬錢子有大毒，必須炮製並嚴格控量。"},
  {"id":"M3-022","module":"M3","difficulty":"基礎","question":"「苦能泄、能燥、能堅」中的「堅」主要指？","options":["A. 堅陰（瀉火存陰）","B. 使大便堅硬","C. 使肌肉堅實","D. 使脈象堅實"],"answer":"A","explanation":"苦能堅陰，指通過瀉火而存陰。"},
  {"id":"M3-023","module":"M3","difficulty":"困難","question":"患者因服用含雄黃的中成藥過量，出現噁心、嘔吐、腹痛。急救原則包括？","options":["A. 立即停藥、催吐、洗胃，並使用解毒劑，緊急就醫","B. 繼續服用原藥","C. 只喝綠豆湯觀察","D. 使用大量附子"],"answer":"A","explanation":"雄黃（砷）中毒需立即清除毒物並使用特效解毒劑。"},
  {"id":"M3-024","module":"M3","difficulty":"中等","question":"巴豆的正確使用原則是？","options":["A. 可直接生用","B. 屬峻下冷積藥，有大毒，需炮製並嚴格控量","C. 孕婦可少量使用","D. 無毒性"],"answer":"B","explanation":"巴豆有大毒，必須製成巴豆霜並嚴格控制劑量。"},
  {"id":"M3-025","module":"M3","difficulty":"基礎","question":"性味「甘平」的藥物，主要功效傾向是？","options":["A. 補益、緩和、調和藥性","B. 發散風寒","C. 清熱瀉火","D. 活血化瘀"],"answer":"A","explanation":"甘味能補、能和、能緩，性平則作用緩和。"},
  {"id":"M3-026","module":"M3","difficulty":"中等","question":"下列哪味藥屬「十九畏」？","options":["A. 硫黃畏朴硝","B. 水銀畏砒霜","C. 狼毒畏密陀僧","D. 以上皆是"],"answer":"D","explanation":"十九畏包括多組相畏藥對。"},
  {"id":"M3-031","module":"M3","difficulty":"中等","question":"雷公藤的使用最需注意什麼？","options":["A. 嚴格控制療程與劑量，定期監測肝腎功能與血常規","B. 可長期大劑量使用","C. 孕婦可正常使用","D. 無明顯毒性"],"answer":"A","explanation":"雷公藤毒性較大，需嚴密監測。"},
  {"id":"M3-032","module":"M3","difficulty":"基礎","question":"下列哪味藥性味為「辛甘大熱、有毒」？","options":["A. 乾薑","B. 附子","C. 肉桂","D. 吳茱萸"],"answer":"B","explanation":"附子辛甘大熱、有毒。"},
  {"id":"M3-033","module":"M3","difficulty":"困難","question":"患者服用含川烏製劑後出現口舌麻木、四肢無力、心率減慢。首要措施是？","options":["A. 立即停藥並使用阿托品，緊急就醫","B. 大量飲水","C. 繼續觀察","D. 服用甘草湯即可"],"answer":"A","explanation":"烏頭鹼中毒需抗膽鹼處理並急救。"},

  {"id":"M3-044","module":"M3","difficulty":"中等","question":"十八反中，烏頭反哪些藥？","options":["A. 半夏、瓜蔞、貝母、白蘞、白及","B. 甘遂、大戟、海藻、芫花","C. 人參、沙參","D. 以上皆非"],"answer":"A","explanation":"烏頭反半夏、瓜蔞、貝母、白蘞、白及。"},

  {"id":"M4-037","module":"M4","difficulty":"困難","question":"募合配穴的臨床應用主要針對？","options":["A. 六腑病證","B. 五臟虛證","C. 外感表證","D. 經絡瘀滯"],"answer":"A","explanation":"募穴與下合穴相配，善治腑病。"},
  {"id":"M4-038","module":"M4","difficulty":"基礎","question":"合穴的主治特點是？","options":["A. 逆氣而泄、腑病","B. 身熱","C. 体重節痛","D. 心下滿"],"answer":"A","explanation":"合主逆氣而泄。"},
  {"id":"M4-039","module":"M4","difficulty":"中等","question":"患者外感咳嗽、咽痛，優先考慮的八脈交會穴配伍是？","options":["A. 內關 + 公孫","B. 列缺 + 照海","C. 後溪 + 申脈","D. 外關 + 足臨泣"],"answer":"B","explanation":"列缺配照海善治肺系、咽喉病。"},
  {"id":"M4-040","module":"M4","difficulty":"基礎","question":"太淵既是原穴，也是？","options":["A. 脈會","B. 筋會","C. 髓會","D. 血會"],"answer":"A","explanation":"太淵為脈會。"},
  {"id":"M4-041","module":"M4","difficulty":"中等","question":"八會穴中「氣會」是？","options":["A. 膻中","B. 膈俞","C. 太淵","D. 陽陵泉"],"answer":"A","explanation":"氣會膻中。"},
  {"id":"M4-042","module":"M4","difficulty":"基礎","question":"五輸穴中，輸穴的主治特點是？","options":["A. 体重節痛","B. 身熱","C. 喘咳寒熱","D. 逆氣而泄"],"answer":"A","explanation":"輸主體重節痛。"},
  {"id":"M4-043","module":"M4","difficulty":"困難","question":"患者心胸痛、脘腹不適，優先考慮的八脈交會穴配伍是？","options":["A. 內關 + 公孫","B. 列缺 + 照海","C. 後溪 + 申脈","D. 外關 + 足臨泣"],"answer":"A","explanation":"內關配公孫合治心、胸、胃。"},
  {"id":"M4-044","module":"M4","difficulty":"中等","question":"下合穴中，胃的下合穴是？","options":["A. 足三里","B. 上巨虛","C. 下巨虛","D. 委中"],"answer":"A","explanation":"胃下合於足三里。"},
  {"id":"M4-045","module":"M4","difficulty":"基礎","question":"郄穴的主要臨床特點是？","options":["A. 治療急性痛證與血證","B. 治療表裡經病","C. 治療臟腑虛證","D. 治療外感"],"answer":"A","explanation":"郄穴善治急痛與血證。"},

  // M5 經典條文 (30)
  {"id":"M5-001","module":"M5","difficulty":"基礎","question":"《傷寒論》「太陽病，發熱汗出，惡風，脈緩者」，名為何證？","options":["A. 中風","B. 傷寒","C. 溫病","D. 風溫"],"answer":"A","explanation":"第2條：名為中風。"},
  {"id":"M5-002","module":"M5","difficulty":"中等","question":"《金匱要略》「見肝之病，知肝傳脾，當先實脾」體現的治療原則是？","options":["A. 治已病","B. 治未病、既病防變","C. 扶正祛邪","D. 攻補兼施"],"answer":"B","explanation":"此為治未病思想。"},
  {"id":"M5-003","module":"M5","difficulty":"中等","question":"《溫病條辨》「太陰風溫、溫熱……初起惡風寒者，桂枝湯主之」的臨床意義是？","options":["A. 溫病一律禁用辛溫","B. 溫病初期若見表寒，仍可用桂枝湯","C. 所有溫病都用桂枝湯","D. 桂枝湯只用於傷寒"],"answer":"B","explanation":"仍需辨證，不可見溫就棄用辛溫。"},
  {"id":"M5-004","module":"M5","difficulty":"困難","question":"《傷寒論》「少陰之為病，脈微細，但欲寐也」強調的核心病機是？","options":["A. 單純陽氣虛衰","B. 單純陰血不足","C. 心腎陽虛、神氣失養","D. 單純寒邪盛"],"answer":"C","explanation":"脈微細、但欲寐為心腎陽虛、神氣衰。"},
  {"id":"M5-005","module":"M5","difficulty":"中等","question":"《金匱要略》治療痰飲的重要原則「病痰飲者，當以溫藥和之」出自哪一篇？","options":["A. 痰飲咳嗽病篇","B. 胸痹心痛短氣病篇","C. 水氣病篇","D. 驚悸吐衄下血胸滿瘀血病篇"],"answer":"A","explanation":"痰飲咳嗽病篇提出此原則。"},
  {"id":"M5-006","module":"M5","difficulty":"基礎","question":"《傷寒論》太陽病提綱是？","options":["A. 太陽之為病，脈浮，頭項強痛而惡寒","B. 陽明之為病，胃家實是也","C. 少陽之為病，口苦、咽乾、目眩","D. 太陰之為病，腹滿而吐，食不下"],"answer":"A","explanation":"第1條為太陽病提綱。"},
  {"id":"M5-009","module":"M5","difficulty":"基礎","question":"《傷寒論》「陽明之為病，胃家實是也」中的「胃家實」主要是指？","options":["A. 胃腸燥熱結實","B. 胃氣虛","C. 胃寒","D. 胃陰不足"],"answer":"A","explanation":"指腸胃邪熱與糟粕互結的腑實證。"},
  {"id":"M5-013","module":"M5","difficulty":"基礎","question":"《傷寒論》「少陽之為病，口苦、咽乾、目眩也」是哪一條？","options":["A. 第1條","B. 第96條","C. 第263條","D. 第273條"],"answer":"C","explanation":"第263條為少陽病提綱。"},
  {"id":"M5-014","module":"M5","difficulty":"中等","question":"《金匱要略》胸痹的主要病機是？","options":["A. 陽微陰弦","B. 陰虛火旺","C. 氣滯血瘀","D. 痰熱互結"],"answer":"A","explanation":"「陽微陰弦，即胸痹而痛」。"},
  {"id":"M5-021","module":"M5","difficulty":"中等","question":"《傷寒論》「傷寒脈浮，自汗出，小便數，心煩，微惡寒，腳攣急……」後用桂枝加附子湯，病機是？","options":["A. 陽虛汗漏","B. 陰虛液虧","C. 氣滯血瘀","D. 痰飲內停"],"answer":"A","explanation":"發汗太過導致陽虛汗漏。"},
  {"id":"M5-022","module":"M5","difficulty":"困難","question":"《溫病條辨》「入營猶可透熱轉氣」的代表方是？","options":["A. 清營湯","B. 犀角地黃湯","C. 白虎湯","D. 承氣湯"],"answer":"A","explanation":"清營湯有透熱轉氣之用。"},
  {"id":"M5-023","module":"M5","difficulty":"基礎","question":"《傷寒論》太陰病提綱是？","options":["A. 腹滿而吐，食不下，自利益甚，時腹自痛","B. 脈微細，但欲寐","C. 口苦、咽乾、目眩","D. 胃家實"],"answer":"A","explanation":"第273條為太陰病提綱。"},
  {"id":"M5-024","module":"M5","difficulty":"中等","question":"《金匱要略》「渴欲飲水，口乾舌燥者，白虎加人參湯主之」主要病機是？","options":["A. 氣分熱盛、氣津兩傷","B. 營分熱盛","C. 血分熱盛","D. 陽虛水停"],"answer":"A","explanation":"熱盛傷津耗氣。"},
  {"id":"M5-025","module":"M5","difficulty":"困難","question":"《傷寒論》「少陰病，得之二三日，口燥咽乾者，急下之，宜大承氣湯」的意義是？","options":["A. 少陰病一律用溫藥","B. 少陰熱化、熱灼真陰時，急下存陰","C. 少陰病禁用下法","D. 僅用於陽明病"],"answer":"B","explanation":"此為少陰急下證，急下以存陰。"},
  {"id":"M5-026","module":"M5","difficulty":"中等","question":"《溫病條辨》強調溫病初起仍需根據什麼決定用辛溫或辛涼？","options":["A. 有無惡寒","B. 有無汗出","C. 脈象浮沉","D. 舌苔厚薄"],"answer":"A","explanation":"惡風寒者可用桂枝湯，但熱不惡寒而渴者用銀翹散。"},
  {"id":"M5-031","module":"M5","difficulty":"中等","question":"《傷寒論》「太陽病，發熱汗出者，此為榮弱衛強，故使汗出」中，榮弱衛強是指？","options":["A. 營陰不足、衛氣偏盛","B. 衛氣不足","C. 營衛俱虛","D. 營衛俱強"],"answer":"A","explanation":"營弱衛強為中風病機。"},
  {"id":"M5-032","module":"M5","difficulty":"基礎","question":"《金匱要略》「陽微陰弦」是指？","options":["A. 胸痹的病機","B. 痰飲的病機","C. 虛勞的病機","D. 黃疸的病機"],"answer":"A","explanation":"陽微陰弦即胸痹而痛。"},
  {"id":"M5-033","module":"M5","difficulty":"困難","question":"《溫病條辨》「溫邪上受，首先犯肺，逆傳心包」強調溫病的？","options":["A. 傳變特點","B. 治療原則","C. 診斷方法","D. 預後判斷"],"answer":"A","explanation":"此句說明溫病由肺衛可逆傳心包的特點。"},
  {"id":"M5-034","module":"M5","difficulty":"中等","question":"《傷寒論》「見肝之病，知肝傳脾，當先實脾」出自哪部書的精神？","options":["A. 《金匱要略》明確提出","B. 僅見於《傷寒論》","C. 《溫病條辨》","D. 《黃帝內經》原文"],"answer":"A","explanation":"《金匱要略》首篇提出治未病思想。"},
  {"id":"M5-035","module":"M5","difficulty":"基礎","question":"《傷寒論》「陽明之為病，胃家實是也」中的「胃家」主要指？","options":["A. 胃與腸","B. 僅指胃","C. 脾胃","D. 肝膽"],"answer":"A","explanation":"胃家實指腸胃燥熱結實。"},
  {"id":"M5-036","module":"M5","difficulty":"中等","question":"《金匱要略》治療虛勞的重要方劑是？","options":["A. 腎氣丸、小建中湯、黃耆建中湯等","B. 大承氣湯","C. 白虎湯","D. 桃核承氣湯"],"answer":"A","explanation":"虛勞篇多用建中、腎氣等方。"},
  {"id":"M5-037","module":"M5","difficulty":"困難","question":"《傷寒論》少陰急下三證的共同病機是？","options":["A. 熱灼真陰，需急下存陰","B. 陽虛寒盛","C. 水飲內停","D. 氣滯血瘀"],"answer":"A","explanation":"少陰熱化、陰液將竭時急下存陰。"},
  {"id":"M5-038","module":"M5","difficulty":"中等","question":"《溫病條辨》銀翹散與桑菊飲的主要區別在於？","options":["A. 銀翹散解表力強，桑菊飲宣肺止咳力較強","B. 兩者完全相同","C. 銀翹散用於傷寒","D. 桑菊飲熱勢更重"],"answer":"A","explanation":"銀翹透表，桑菊宣肺。"},
  {"id":"M5-039","module":"M5","difficulty":"基礎","question":"《傷寒論》「少陽之為病，口苦、咽乾、目眩也」是第幾條？","options":["A. 第263條","B. 第96條","C. 第1條","D. 第273條"],"answer":"A","explanation":"第263條為少陽病提綱。"},
  {"id":"M5-040","module":"M5","difficulty":"中等","question":"《金匱要略》「病痰飲者，當以溫藥和之」的臨床意義是？","options":["A. 痰飲屬陰邪，當溫化","B. 痰飲當用寒藥","C. 痰飲當用攻下","D. 痰飲當用補藥"],"answer":"A","explanation":"溫藥可化飲、健脾、溫陽。"},
  {"id":"M5-041","module":"M5","difficulty":"中等","question":"《傷寒論》「太陽病，初服桂枝湯，反煩不解者，先刺風池、風府，卻與桂枝湯則愈」說明？","options":["A. 表鬱較重時可先針刺再開表","B. 桂枝湯無效","C. 應改用麻黃湯","D. 屬裡證"],"answer":"A","explanation":"表鬱重時先刺風池、風府疏通經氣。"},
  {"id":"M5-042","module":"M5","difficulty":"基礎","question":"《金匱要略》「夫治未病者，見肝之病，知肝傳脾，當先實脾」後，什麼情況下可不實脾？","options":["A. 脾旺不受邪","B. 任何情況都要實脾","C. 肝病嚴重時","D. 脾氣已虛時"],"answer":"A","explanation":"四季脾旺不受邪，即勿補之。"},
  {"id":"M5-043","module":"M5","difficulty":"困難","question":"《溫病條辨》「熱結液乾」之大實證，宜用？","options":["A. 大承氣湯","B. 增液承氣湯","C. 調胃承氣湯","D. 小承氣湯"],"answer":"B","explanation":"溫病熱結陰虧，需增液與攻下並行。"},
  {"id":"M5-044","module":"M5","difficulty":"中等","question":"《傷寒論》「傷寒脈結代，心動悸，炙甘草湯主之」中，脈結代反映？","options":["A. 氣血陰陽俱虛，心脈失養","B. 單純氣虛","C. 寒凝心脈","D. 痰阻心脈"],"answer":"A","explanation":"結代脈為氣血虛弱、脈氣不相接續。"},
  {"id":"M5-045","module":"M5","difficulty":"基礎","question":"《金匱要略》胸痹的主要病機用四字概括是？","options":["A. 陽微陰弦","B. 陰虛火旺","C. 氣滯血瘀","D. 痰熱互結"],"answer":"A","explanation":"陽微陰弦，即胸痹而痛。"},

  // M6 疑難與中西 (25)
  {"id":"M6-001","module":"M6","difficulty":"中等","question":"腫瘤患者化療後出現極度疲乏、納差、便溏、白细胞低下、舌淡胖有齒痕。中醫首要原則是？","options":["A. 大劑清熱解毒抗癌","B. 健脾益氣、培土生金為先","C. 活血化瘀為主","D. 滋陰降火"],"answer":"B","explanation":"先顧護胃氣與正氣。"},
  {"id":"M6-002","module":"M6","difficulty":"基礎","question":"「腫瘤患者絕對不能用補藥，否則會促進腫瘤生長」的說法是否正確？","options":["A. 正確","B. 錯誤","C. 僅對實證腫瘤正確","D. 僅對晚期患者正確"],"answer":"B","explanation":"應辨證使用扶正藥。"},
  {"id":"M6-003","module":"M6","difficulty":"中等","question":"社區獲得性肺炎患者，抗生素使用3天後熱退不全、咳嗽黃痰仍多。中醫較適合的介入方式是？","options":["A. 立即停用所有西藥","B. 清熱解毒、宣肺化痰，與抗生素協同","C. 大劑溫陽以防寒涼傷陽","D. 只用中成藥"],"answer":"B","explanation":"中西協同可縮短病程。"},
  {"id":"M6-004","module":"M6","difficulty":"困難","question":"長期服用激素的患者出現陰虛火旺症狀，中醫介入的最佳時機通常是？","options":["A. 激素剛開始使用時","B. 激素減量階段","C. 激素已停用半年後","D. 任何時候都不宜介入"],"answer":"B","explanation":"激素減量階段介入有助減少反跳。"},
  {"id":"M6-005","module":"M6","difficulty":"中等","question":"反覆口腔潰瘍、五心煩熱、失眠、舌紅少苔，西醫檢查無明顯異常。中醫最可能的方向是？","options":["A. 心脾積熱","B. 陰虛火旺","C. 氣虛生瘡","D. 濕熱上蒸"],"answer":"B","explanation":"典型陰虛火旺表現。"},
  {"id":"M6-007","module":"M6","difficulty":"困難","question":"「中藥不能與西藥同時服用，否則會產生嚴重相互作用」的說法是否正確？","options":["A. 完全正確，一律不能同服","B. 錯誤，多數情況下可間隔服用，但需注意特定相互作用","C. 只有抗生素不能與中藥同服","D. 只有中成藥不能與西藥同服"],"answer":"B","explanation":"多數可間隔服用，但需注意特定藥物相互作用。"},
  {"id":"M6-009","module":"M6","difficulty":"基礎","question":"「所有發熱都應先用抗生素，再用中藥」的做法是否正確？","options":["A. 正確","B. 錯誤","C. 僅對細菌感染正確","D. 僅對高熱正確"],"answer":"B","explanation":"發熱原因眾多，應先辨證與鑑別。"},
  {"id":"M6-013","module":"M6","difficulty":"困難","question":"「中醫只能治療功能性疾病，器質性疾病必須靠西醫」的觀點是否正確？","options":["A. 完全正確","B. 錯誤，中醫在多種器質性疾病的症狀改善與輔助治療中有明確價值","C. 僅對腫瘤正確","D. 僅對感染性疾病正確"],"answer":"B","explanation":"中醫在慢性腎病、腫瘤輔助等器質性疾病中均有價值。"},
  {"id":"M6-015","module":"M6","difficulty":"基礎","question":"「中藥沒有副作用，可以長期大劑量服用」的說法是否正確？","options":["A. 正確","B. 錯誤","C. 僅對補藥正確","D. 僅對成藥正確"],"answer":"B","explanation":"中藥同樣有不良反應與毒性，需合理使用。"},
  {"id":"M6-021","module":"M6","difficulty":"中等","question":"慢性腎臟病患者，西醫已用ACEI/ARB，仍見腰酸乏力、畏寒、夜尿多、舌淡胖。中醫較適合的方向是？","options":["A. 大劑清熱利濕","B. 溫補脾腎、固攝精微","C. 活血化瘀為主","D. 純用攻下"],"answer":"B","explanation":"脾腎陽虛為本，溫補可改善症狀。"},
  {"id":"M6-022","module":"M6","difficulty":"困難","question":"腫瘤放療後出現口乾咽痛、吞嚥困難、舌紅少津。中醫治療重點應放在？","options":["A. 大劑清熱解毒","B. 養陰生津、清熱潤燥","C. 溫陽益氣","D. 活血化瘀"],"answer":"B","explanation":"放療屬熱毒傷陰，養陰生津為核心。"},
  {"id":"M6-023","module":"M6","difficulty":"中等","question":"慢性失眠患者，西醫已用鎮靜催眠藥，仍睡後易醒、多夢、心悸、舌淡。中醫較適合的介入是？","options":["A. 繼續加大鎮靜藥劑量","B. 養心安神、健脾益氣，協助減停西藥","C. 純用重鎮安神中藥長期替代","D. 不予處理"],"answer":"B","explanation":"中醫可改善睡眠質量，協助減停西藥。"},

  {"id":"M6-036","module":"M6","difficulty":"中等","question":"更年期婦女潮熱盜汗、失眠、情緒波動，拒絕激素替代。中醫較適合的思路是？","options":["A. 純用清熱降火","B. 滋腎養陰、調暢氣機","C. 大劑活血化瘀","D. 溫補腎陽為主"],"answer":"B","explanation":"更年期多屬腎陰不足、肝氣鬱滯。"},

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTone(freq, duration, type = "sine") {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function playCorrect() {
      initAudio();
      playTone(523.25, 0.12);
      setTimeout(() => playTone(659.25, 0.15), 100);
    }
    function playWrong() {
      initAudio();
      playTone(220, 0.25, "triangle");
    }

    // ==================== 進度儲存 ====================
    const STORAGE_KEY = "liujing_progress";

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function saveProgress(progress) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    function getMasteredIds(module) {
      const progress = loadProgress();
      return progress[module] || [];
    }

    function markAsMastered(module, questionId) {
      const progress = loadProgress();
      if (!progress[module]) progress[module] = [];
      if (!progress[module].includes(questionId)) {
        progress[module].push(questionId);
        saveProgress(progress);
      }
    }

    function isModuleCompleted(module) {
      const mastered = getMasteredIds(module);
      const totalInModule = allQuestions.filter(q => q.module === module).length;
      return mastered.length >= totalInModule && totalInModule > 0;
    }

    // ==================== 遊戲狀態 ====================
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;
    let currentModule = "";

    const pages = {
      home: document.getElementById("page-home"),
      modules: document.getElementById("page-modules"),
      quiz: document.getElementById("page-quiz"),
      result: document.getElementById("page-result")
    };

    function showPage(name) {
      Object.values(pages).forEach(p => p.classList.remove("active"));
      pages[name].classList.add("active");
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ==================== 開始關卡 ====================
    function startQuiz(module) {
      currentModule = module;

      // 檢查是否已全部完成
      if (module !== "all" && isModuleCompleted(module)) {
        alert("此關卡已全部完成！");
        return;
      }

      let pool = [];
      if (module === "all") {
        // 全部題目：只出還沒掌握的
        const allMastered = [];
        ["M1","M2","M3","M4","M5","M6"].forEach(m => {
          allMastered.push(...getMasteredIds(m));
        });
        pool = allQuestions.filter(q => !allMastered.includes(q.id));
      } else {
        // 單一關卡：只出還沒掌握的
        const mastered = getMasteredIds(module);
        pool = allQuestions.filter(q => q.module === module && !mastered.includes(q.id));
      }

      if (pool.length === 0) {
        alert("此關卡已全部完成！");
        return;
      }

      currentQuestions = shuffle(pool);
      currentIndex = 0;
      score = 0;
      correctCount = 0;
      showPage("quiz");
      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      document.getElementById("q-current").textContent = currentIndex + 1;
      document.getElementById("q-total").textContent = currentQuestions.length;
      document.getElementById("live-score").textContent = score;
      document.getElementById("progress-fill").style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
      document.getElementById("diff-tag").textContent = q.difficulty || "基礎";
      document.getElementById("diff-tag").className = "diff-tag " + (q.difficulty || "基礎");
      document.getElementById("question-text").textContent = q.question;

      const optionsEl = document.getElementById("options");
      optionsEl.innerHTML = "";
      q.options.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.textContent = opt;
        div.addEventListener("click", () => handleAnswer(div, q));
        optionsEl.appendChild(div);
      });
      document.getElementById("feedback-panel").classList.add("hidden");
    }

    function handleAnswer(selected, q) {
      const options = document.querySelectorAll(".option");
      options.forEach(o => o.classList.add("disabled"));

      const correctOpt = q.options.find(o => o.startsWith(q.answer + ".") || o.startsWith(q.answer + " "));
      const isCorrect = selected.textContent === correctOpt;

      if (isCorrect) {
        selected.classList.add("correct");
        document.getElementById("feedback-title").textContent = "✅ 心法契合";
        document.getElementById("feedback-title").className = "feedback-title ok";
        correctCount++;
        const point = q.difficulty === "困難" ? 3 : q.difficulty === "中等" ? 2 : 1;
        score += point;

        // 答對 → 標記為已掌握，之後不再出現
        markAsMastered(q.module, q.id);

        playCorrect();
      } else {
        selected.classList.add("wrong");
        document.getElementById("feedback-title").textContent = "❌ 此處尚需精進";
        document.getElementById("feedback-title").className = "feedback-title ng";
        options.forEach(o => {
          if (o.textContent === correctOpt) o.classList.add("correct");
        });
        // 答錯不標記，之後還會再出現
        playWrong();
      }

      document.getElementById("feedback-explain").textContent = q.explanation || "暫無解析";
      document.getElementById("live-score").textContent = score;
      document.getElementById("feedback-panel").classList.remove("hidden");
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("result-score").textContent = score;
      document.getElementById("result-correct").textContent = correctCount;
      document.getElementById("result-total").textContent = currentQuestions.length;

      const accuracy = currentQuestions.length > 0
        ? Math.round((correctCount / currentQuestions.length) * 100) + "%"
        : "0%";
      document.getElementById("result-accuracy").textContent = accuracy;

      // 檢查是否整個關卡已完成
      if (currentModule !== "all" && isModuleCompleted(currentModule)) {
        document.getElementById("result-label").textContent = "關卡已完成";
        document.querySelector(".result-emoji").textContent = "🏆";
      } else {
        document.getElementById("result-label").textContent = "本次修行功果";
        document.querySelector(".result-emoji").textContent = "🎌";
      }

      showPage("result");
    }

    // ==================== 事件綁定 ====================
    document.getElementById("btn-start").addEventListener("click", () => {
      initAudio();
      showPage("modules");
    });

    document.querySelectorAll(".module-card").forEach(card => {
      card.addEventListener("click", () => {
        const module = card.dataset.module;
        startQuiz(module);
      });
    });

    document.getElementById("btn-next").addEventListener("click", nextQuestion);
    document.getElementById("btn-home").addEventListener("click", () => showPage("home"));

    document.querySelectorAll(".btn-back").forEach(btn => {
      btn.addEventListener("click", () => showPage(btn.dataset.back));
    });

    // 音效函式（保持原本的）
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTone(freq, duration, type = "sine") {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function playCorrect() {
      initAudio();
      playTone(523.25, 0.12);
      setTimeout(() => playTone(659.25, 0.15), 100);
    }
    function playWrong() {
      initAudio();
      playTone(220, 0.25, "triangle");
    }
  </script>
